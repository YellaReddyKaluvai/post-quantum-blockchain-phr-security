# Local deployment: database, backend and frontend on one network.
#
#   docker compose up --build
#
# The chain and IPFS nodes are deliberately left out. Both are external
# infrastructure a hospital would point at rather than ship, and the system is
# designed to run without them — an unreachable chain produces a clearly
# labelled local-simulated anchor rather than a silent failure.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pqc_hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pqc_hospital"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The application reads one connection string (app/config.py). The
      # separate DB_* values below are for the maintenance scripts in backend/.
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/pqc_hospital
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pqc_hospital
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Secrets stay out of the image and out of source control. Generate them
      # with backend/.env.example's instructions; ENCRYPTION_KEY must be exactly
      # 32 characters, and left unset the app falls back to a key published in
      # this repository, which is no key at all.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quantumcare.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FEDERATION_LAB_MODE: ${FEDERATION_LAB_MODE:-false}
      FEDERATION_REQUIRE_FRESH_UPDATES: ${FEDERATION_REQUIRE_FRESH_UPDATES:-false}
      SECURITY_ANALYSIS_INTERVAL_MINUTES: ${SECURITY_ANALYSIS_INTERVAL_MINUTES:-5}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      CONSENT_LEDGER_KEY: ${CONSENT_LEDGER_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      # Optional external infrastructure. Absent is a supported state.
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      IPFS_API_URL: ${IPFS_API_URL:-}
      # Federated learning (spec §20–21). Blank = this hospital federates with
      # nobody; an administrator can also join from the AI Security screen.
      FEDERATION_HUB_URL: ${FEDERATION_HUB_URL:-}
      FEDERATION_NODE_NAME: ${FEDERATION_NODE_NAME:-}
      FEDERATION_SHARED_SECRET: ${FEDERATION_SHARED_SECRET:-}
      FEDERATION_DP_EPSILON: ${FEDERATION_DP_EPSILON:-}
      FEDERATION_DP_TOTAL_EPSILON: ${FEDERATION_DP_TOTAL_EPSILON:-}
      FEDERATION_SYNC_INTERVAL_MINUTES: ${FEDERATION_SYNC_INTERVAL_MINUTES:-0}
      FEDERATION_ROUND_INTERVAL_MINUTES: ${FEDERATION_ROUND_INTERVAL_MINUTES:-0}
      FEDERATION_LOCAL_EPOCHS: ${FEDERATION_LOCAL_EPOCHS:-200}
      FEDERATION_MIN_PEERS: ${FEDERATION_MIN_PEERS:-1}
      # Internal API traffic must not be sent through a corporate HTTP proxy.
      NO_PROXY: ${FEDERATION_NO_PROXY:-localhost,127.0.0.1,::1,hospital-a,hospital-b,hospital-c}
      no_proxy: ${FEDERATION_NO_PROXY:-localhost,127.0.0.1,::1,hospital-a,hospital-b,hospital-c}
      # Frontends allowed to call the API with the HttpOnly session cookie. The
      # browser reaches the API through the frontend's own origin by default,
      # so this matters only if you point NEXT_PUBLIC_BACKEND_URL at port 8000.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      HOSPITAL_TIMEZONE: ${HOSPITAL_TIMEZONE:-Asia/Kolkata}
      APPOINTMENT_START_HOUR: ${APPOINTMENT_START_HOUR:-9}
      APPOINTMENT_END_HOUR: ${APPOINTMENT_END_HOUR:-17}
      REQUIRE_CONSENT_PROOF: ${REQUIRE_CONSENT_PROOF:-false}
      REQUIRE_AUTHENTICATED_COLUMNS: ${REQUIRE_AUTHENTICATED_COLUMNS:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 20
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty (the default) makes the browser call /api on the host that
        # served the page, which Next.js proxies to BACKEND_ORIGIN below. That
        # is what lets another machine on the network open this dashboard.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL-}
        BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend
    environment:
      # Server-side, inside this container: where to forward /api.
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
