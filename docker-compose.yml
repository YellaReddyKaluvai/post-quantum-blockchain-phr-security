# Local deployment: database, backend and frontend on one network.
#
#   docker compose up --build
#
# The chain and IPFS nodes are deliberately left out. Both are external
# infrastructure a hospital would point at rather than ship, and the system is
# designed to run without them — an unreachable chain produces a clearly
# labelled local-simulated anchor rather than a silent failure.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pqc_hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pqc_hospital"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pqc_hospital
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Secrets stay out of the image and out of source control.
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      # Optional external infrastructure. Absent is a supported state.
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      IPFS_API_URL: ${IPFS_API_URL:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
